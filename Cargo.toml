[package]
name = "wasm_tutorial"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
js-sys = "0.3.85"
getrandom = {version="*", features = ['wasm_js']}
magic_cap = "0.0.0"
wasm-bindgen = "0.2.108"
wasm-bindgen-futures = "0.4.58"
web-sys = {version = "*", features = ['Document', 'Element', 'HtmlElement', 'Node', 'Window', 'Headers', 'Request', 'RequestInit', 'RequestMode', 'Response', 'console', 'ReadableStream', 'ReadableStreamDefaultReader']}

